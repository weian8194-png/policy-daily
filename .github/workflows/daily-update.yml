name: Daily cloud update

on:
  schedule:
    # Start at 07:00 in Shanghai so the published pages can be ready by 08:00.
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Optional report date (YYYY-MM-DD); blank uses today in Shanghai"
        required: false
        type: string

concurrency:
  group: daily-cloud-update
  cancel-in-progress: false

permissions: {}

jobs:
  generate:
    name: Research and generate patch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      patch: ${{ steps.codex.outputs.final-message }}
      research-outcome: ${{ steps.codex.outcome }}
      run-date: ${{ steps.run-date.outputs.date }}
    steps:
      - name: Check out the current site
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Determine the Shanghai report date
        id: run-date
        shell: bash
        env:
          REQUESTED_DATE: ${{ inputs.report_date }}
        run: |
          if [ -n "$REQUESTED_DATE" ]; then
            if [[ ! "$REQUESTED_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || \
              ! date -d "$REQUESTED_DATE" +%F >/dev/null 2>&1; then
              echo "report_date must be a valid YYYY-MM-DD date" >&2
              exit 1
            fi
            report_date="$REQUESTED_DATE"
          else
            report_date="$(TZ=Asia/Shanghai date +%F)"
          fi
          echo "date=$report_date" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$report_date" > .daily-update-date

      - name: Require the API gateway key
        shell: bash
        env:
          API_GATEWAY_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$API_GATEWAY_KEY" ]; then
            echo "Repository secret OPENAI_API_KEY is not configured." >&2
            exit 1
          fi

      - name: Select and check a TokenHub model
        id: gateway
        continue-on-error: true
        shell: bash
        env:
          API_GATEWAY_KEY: ${{ secrets.OPENAI_API_KEY }}
          REQUESTED_MODEL: ${{ vars.TOKEN_HUB_MODEL }}
        run: |
          models_file="$(mktemp)"
          curl --fail --silent --show-error --max-time 30 \
            --output "$models_file" \
            --header "Authorization: Bearer $API_GATEWAY_KEY" \
            https://token-hub.hoomenology.com/v1/models

          if [ -n "$REQUESTED_MODEL" ]; then
            model="$REQUESTED_MODEL"
          else
            model="$(jq -r '
              [.data[].id] as $ids |
              ["gpt-5.2-codex", "gpt-5.1-codex-max", "gpt-5.1-codex",
               "gpt-5-codex", "gpt-4.1", "gpt-4.1-mini"] |
              map(select(. as $candidate | $ids | index($candidate))) | .[0] // empty
            ' "$models_file")"
          fi
          if [ -z "$model" ] || ! jq -e --arg model "$model" \
            '.data | any(.id == $model)' "$models_file" >/dev/null; then
            echo "No supported TokenHub model was found. Available GPT/Codex models:" >&2
            jq -r '.data[].id | select(test("gpt|codex"; "i"))' "$models_file" \
              | sort | head -40 >&2
            exit 1
          fi

          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error --max-time 90 \
            --output "$response_file" --write-out '%{http_code}' \
            --request POST https://token-hub.hoomenology.com/v1/responses \
            --header "Authorization: Bearer $API_GATEWAY_KEY" \
            --header 'Content-Type: application/json' \
            --data "$(jq -cn --arg model "$model" \
              '{model: $model, input: "Reply with OK only.", max_output_tokens: 16}')")"
          if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
            jq '{error: (.error.message // "unknown gateway error"), type: (.error.type // "unknown")}' \
              "$response_file" >&2 || true
            exit 1
          fi
          jq -e '.id and (.output | type == "array")' "$response_file" >/dev/null
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "TokenHub model check passed: $model"

      # Keep this as the final step in the job. The generated patch crosses into
      # a clean runner before any GitHub write token becomes available.
      - name: Run the daily publishing agent
        id: codex
        if: steps.gateway.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 25
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          responses-api-endpoint: https://token-hub.hoomenology.com/v1/responses
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          prompt-file: .github/codex/daily-update.md
          # `--search` is a global CLI flag, while action extra arguments are
          # appended to `codex exec`. Use the equivalent documented config key.
          codex-args: '["-c", "web_search=\"live\""]'
          model: ${{ steps.gateway.outputs.model }}
          effort: medium

  publish:
    name: Validate and publish
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      REPORT_DATE: ${{ needs.generate.outputs.run-date }}
      GENERATED_PATCH: ${{ needs.generate.outputs.patch }}
      RESEARCH_OUTCOME: ${{ needs.generate.outputs.research-outcome }}
    steps:
      - name: Check out the publishing branch
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply the generated patch or prepare a transparent fallback
        shell: bash
        run: |
          if [ "$RESEARCH_OUTCOME" = "success" ] && [ -n "$GENERATED_PATCH" ]; then
            python scripts/apply_daily_patch.py --date "$REPORT_DATE" --env GENERATED_PATCH
          else
            python scripts/prepare_daily_fallback.py --date "$REPORT_DATE"
            python scripts/create_daily_archives.py --date "$REPORT_DATE"
          fi

      - name: Validate both reports
        run: python scripts/validate_daily.py --date "$REPORT_DATE"

      - name: Commit and push
        shell: bash
        run: |
          stamp="${REPORT_DATE//-/}"
          git add -- \
            index.html \
            appliance-trends/index.html \
            "daily/$stamp.html" \
            "appliance-trends/daily/$stamp.html"

          if git diff --cached --quiet; then
            echo "No report changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          commit_date="$(TZ=Asia/Shanghai date -d "$REPORT_DATE" '+%-m/%-d')"
          git commit -m "$commit_date 每日数据更新"
          git push origin HEAD:main

  verify:
    name: Verify GitHub Pages
    needs: [generate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out verification script
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Wait for the published reports
        run: >-
          python scripts/verify_pages.py
          --date "${{ needs.generate.outputs.run-date }}"
          --base-url "https://weian8194-png.github.io/policy-daily/"
          --attempts 20
          --interval 30
